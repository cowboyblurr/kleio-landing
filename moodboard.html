<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KLEIO | Moodboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./moodboard.css">
  </head>
  <body class="moodboard-page">
    <main class="moodboard-stage">
      <section class="reference-canvas" id="reference-canvas">
        <header class="canvas-edge top">
          <span>©2026</span>
          <img
            class="edge-logo"
            src="https://github.com/cowboyblurr/KLEIO-ASSETS/blob/main/blackkleiologofinal.png?raw=true"
            alt="KLEIO"
          >
          <a href="./identity-manifest.html" class="edge-link">INFO</a>
        </header>

        <div class="collage-field" id="collage-field" aria-label="Moodboard collage"></div>

        <div class="center-copy">
          <img
            class="center-backdrop"
            src="https://github.com/cowboyblurr/KLEIO-ASSETS/blob/main/KLEIO%20MENU%20ICON.png?raw=true"
            alt=""
            aria-hidden="true"
          >
          <img
            class="center-logo"
            src="https://github.com/cowboyblurr/KLEIO-ASSETS/blob/main/KLEIO%20LOGO%20WITHOUT%20TEst.png?raw=true"
            alt="KLEIO"
          >
        </div>

        <header class="canvas-edge bottom">
          <button type="button" class="edge-toggle" id="dark-mode-toggle">DARK MODE</button>
          <span>©2026</span>
          <a href="./index.html" class="edge-link">INDEX</a>
        </header>
      </section>
    </main>

    <script src="./moodboard.js"></script>
  </body>
</html>
