<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KLEIO | The Archive is Forming</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
:root {
    --vault-bg: #FFFFFF; 
    --obsidian: #1A1A1A;
}

body, html {
    margin:0;
    min-height:100vh;
    background:var(--vault-bg);
    color:var(--obsidian);
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Inter', sans-serif;
}

.container {
    text-align:center;
}

.hero-composition {
    position:relative;
    max-width:700px;
}

.hero-video {
    width:100%;
    pointer-events:none;
}

/* FIXED STRUCTURE */
.logo-wrapper {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

/* LOGO clickable */
.kleio-logo {
    max-width:310px;
    cursor:pointer;
    z-index:5;
    position:relative;
}

/* NODES */
.wing-node {
    position:absolute;
    top:50%;
    opacity:0;
    visibility:hidden;
    transition:.5s;
    z-index:20;
}

.logo-wrapper.active .left {
    opacity:1;
    visibility:visible;
    transform:translate(-190px,-50%);
}

.logo-wrapper.active .right {
    opacity:1;
    visibility:visible;
    transform:translate(190px,-50%);
}

.menu-item {
    display:flex;
    align-items:center;
    gap:.6rem;
    text-decoration:none;
    color:black;
    font-size:.8rem;
    letter-spacing:.12em;
}

.menu-icon {
    width:38px;
}
</style>
</head>

<body>

<div class="container">
<div class="hero-composition">

<video autoplay loop muted playsinline class="hero-video">
<source src="https://github.com/cowboyblurr/KLEIO-ASSETS/raw/refs/heads/main/Transparent%20webpagebackground.mp4">
</video>

<div class="logo-wrapper" id="logoWrapper">

<!-- LEFT (FIXED LINK) -->
<div class="wing-node left">
<a href="/kleio-landing/identity-manifest.html" class="menu-item">
<img src="https://github.com/cowboyblurr/KLEIO-ASSETS/blob/main/Learn%20more%20icon%20.gif?raw=true" class="menu-icon">
<span>Learn More</span>
</a>
</div>

<img src="https://github.com/cowboyblurr/KLEIO-ASSETS/blob/main/KLEIO%20LOGO.png?raw=true"
class="kleio-logo"
id="logo">

<!-- RIGHT (FIXED LINK) -->
<div class="wing-node right">
<a href="https://x.com/kleio_eco" target="_blank" class="menu-item">
<span>Social Media</span>
<img src="https://github.com/cowboyblurr/KLEIO-ASSETS/blob/main/ezgif-79884294fd0120c1.gif?raw=true" class="menu-icon">
</a>
</div>

</div>
</div>
</div>

<script>
const logo = document.getElementById('logo');
const wrapper = document.getElementById('logoWrapper');

/* ONLY logo toggles */
logo.addEventListener('click', (e)=>{
    wrapper.classList.toggle('active');
    e.stopPropagation();
});

/* click outside closes */
document.addEventListener('click',(e)=>{
    if(!wrapper.contains(e.target)){
        wrapper.classList.remove('active');
    }
});
</script>

</body>
</html>
