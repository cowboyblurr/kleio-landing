<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KLEIO | The Archive is Forming</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
:root {
    --vault-bg: #FFFFFF; 
    --obsidian: #1A1A1A;
}

body, html {
    margin:0;
    min-height:100vh;
    background:var(--vault-bg);
    color:var(--obsidian);
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Inter', sans-serif;
}

.hero-composition {
    position:relative;
    max-width:700px;
}

.hero-video {
    width:100%;
    pointer-events:none;
}

.logo-wrapper {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

/* LOGO */
.kleio-logo {
    max-width:300px;
    cursor:pointer;
    position:relative;
    z-index:5;
}

/* NODES */
.wing-node {
    position:absolute;
    top:50%;
    opacity:0;
    visibility:hidden;
    transition:.5s;
    z-index:50;
    cursor:pointer;
}

.logo-wrapper.active .left {
    opacity:1;
    visibility:visible;
    transform:translate(-190px,-50%);
}

.logo-wrapper.active .right {
    opacity:1;
    visibility:visible;
    transform:translate(190px,-50%);
}

.menu-item {
    display:flex;
    align-items:center;
    gap:.6rem;
    font-size:.8rem;
    letter-spacing:.12em;
}

.menu-icon {
    width:38px;
}
</style>
</head>

<body>

<div class="hero-composition">

<video autoplay loop muted playsinline class="hero-video">
<source src="https://github.com/cowboyblurr/KLEIO-ASSETS/raw/refs/heads/main/Transparent%20webpagebackground.mp4">
</video>

<div class="logo-wrapper" id="wrapper">

<!-- LEFT (JS NAVIGATION) -->
<div class="wing-node left" id="learnMore">
    <div class="menu-item">
        <img src="https://github.com/cowboyblurr/KLEIO-ASSETS/blob/main/Learn%20more%20icon%20.gif?raw=true" class="menu-icon">
        <span>Learn More</span>
    </div>
</div>

<img src="https://github.com/cowboyblurr/KLEIO-ASSETS/blob/main/KLEIO%20LOGO.png?raw=true"
class="kleio-logo"
id="logo">

<!-- RIGHT -->
<div class="wing-node right" id="social">
    <div class="menu-item">
        <span>Social Media</span>
        <img src="https://github.com/cowboyblurr/KLEIO-ASSETS/blob/main/ezgif-79884294fd0120c1.gif?raw=true" class="menu-icon">
    </div>
</div>

</div>

<script>
const wrapper = document.getElementById('wrapper');
const logo = document.getElementById('logo');
const learnMore = document.getElementById('learnMore');
const social = document.getElementById('social');

/* TOGGLE MENU */
logo.onclick = (e)=>{
    wrapper.classList.toggle('active');
    e.stopPropagation();
};

/* CLOSE OUTSIDE */
document.addEventListener('click', (e)=>{
    if(!wrapper.contains(e.target)){
        wrapper.classList.remove('active');
    }
});

/* 🔥 FORCE NAVIGATION (bulletproof) */
learnMore.onclick = ()=>{
    window.location.href = "/kleio-landing/identity-manifest.html";
};

social.onclick = ()=>{
    window.open("https://x.com/kleio_eco", "_blank");
};
</script>

</body>
</html>
