<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KLEIO | The Archive is Forming</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
:root {
    --vault-bg: #FFFFFF; 
    --obsidian: #1A1A1A;
}

body {
    margin:0;
    background:var(--vault-bg);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:'Inter', sans-serif;
}

/* HERO */
.hero {
    position:relative;
    width:700px;
}

video {
    width:100%;
    pointer-events:none;
}

/* LOGO WRAPPER */
.wrapper {
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

/* LOGO */
.logo {
    width:300px;
    cursor:pointer;
    position:relative;
    z-index:10;
}

/* NODES */
.node {
    position:absolute;
    top:50%;
    opacity:0;
    visibility:hidden;
    transition:.5s;
    z-index:20;
}

/* IMPORTANT FIX */
.node a {
    pointer-events:auto;
}

/* prevent parent blocking */
.wrapper {
    pointer-events:none;
}
.logo {
    pointer-events:auto;
}
.node {
    pointer-events:none;
}
.node a {
    pointer-events:auto;
}

/* positions */
.wrapper.active .left {
    opacity:1;
    visibility:visible;
    transform:translate(-200px,-50%);
}
.wrapper.active .right {
    opacity:1;
    visibility:visible;
    transform:translate(200px,-50%);
}

.menu {
    display:flex;
    align-items:center;
    gap:.5rem;
    font-size:.8rem;
    letter-spacing:.1em;
    color:black;
    text-decoration:none;
}

.menu img {
    width:38px;
}
</style>
</head>

<body>

<div class="hero">

<video autoplay loop muted playsinline>
<source src="https://github.com/cowboyblurr/KLEIO-ASSETS/raw/refs/heads/main/Transparent%20webpagebackground.mp4">
</video>

<div class="wrapper" id="wrap">

<!-- LEFT -->
<div class="node left">
<a href="./identity-manifest.html" class="menu">
<img src="https://github.com/cowboyblurr/KLEIO-ASSETS/blob/main/Learn%20more%20icon%20.gif?raw=true">
<span>Learn More</span>
</a>
</div>

<!-- LOGO -->
<img src="https://github.com/cowboyblurr/KLEIO-ASSETS/blob/main/KLEIO%20LOGO.png?raw=true"
class="logo"
id="logo">

<!-- RIGHT -->
<div class="node right">
<a href="https://x.com/kleio_eco" target="_blank" class="menu">
<span>Social Media</span>
<img src="https://github.com/cowboyblurr/KLEIO-ASSETS/blob/main/ezgif-79884294fd0120c1.gif?raw=true">
</a>
</div>

</div>
</div>

<script>
const logo = document.getElementById('logo');
const wrap = document.getElementById('wrap');

logo.onclick = (e)=>{
    wrap.classList.toggle('active');
    e.stopPropagation();
};

document.onclick = (e)=>{
    if(!wrap.contains(e.target)){
        wrap.classList.remove('active');
    }
};
</script>

</body>
</html>
